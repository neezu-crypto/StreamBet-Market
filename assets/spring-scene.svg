<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e0ea"/>
      <stop offset="55%" stop-color="#fdeef2"/>
      <stop offset="100%" stop-color="#fff6f2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#fff3e0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffe3ea" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe3ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7d3d0"/>
      <stop offset="100%" stop-color="#cdb0ac"/>
    </linearGradient>
    <linearGradient id="roadShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6ee" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff6ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9e2c6"/>
      <stop offset="100%" stop-color="#d8ceac"/>
    </linearGradient>
    <radialGradient id="canopyGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe6ef"/>
      <stop offset="45%" stop-color="#f7b3cd"/>
      <stop offset="80%" stop-color="#e888ab"/>
      <stop offset="100%" stop-color="#d4678d"/>
    </radialGradient>
    <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a4a38"/>
      <stop offset="100%" stop-color="#4a2c20"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="farBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#skyGrad)"/>
  <ellipse cx="800" cy="900" rx="900" ry="520" fill="url(#sunGlow)"/>

